[package]
name = "git-remote-freenet"
description = "Git remote helper for freenet: URLs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "git-remote-freenet"
path = "src/main.rs"

[dependencies]
freenet-git-encoding = { workspace = true }
freenet-git-types = { workspace = true, features = ["signing"] }
freenet-git-identity = { workspace = true }
freenet-git = { path = "../freenet-git", version = "0.1.0" }
freenet-stdlib = { workspace = true, features = ["net"] }
ed25519-dalek = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
bincode = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
