[package]
name = "freenet-git"
description = "Push, fetch, and clone Git repositories through Freenet instead of a centralized host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["freenet", "git", "decentralized", "p2p", "git-remote-helper"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**/*",
    "contracts/*.wasm",
    "Cargo.toml",
    "README.md",
]

[[bin]]
name = "freenet-git"
path = "src/main.rs"

[[bin]]
name = "git-remote-freenet"
path = "src/bin/git-remote-freenet.rs"

[lib]
name = "freenet_git_cli"
path = "src/lib.rs"

[dependencies]
freenet-git-encoding = { workspace = true }
freenet-git-types = { workspace = true, features = ["signing"] }
freenet-git-identity = { workspace = true }
freenet-stdlib = { workspace = true, features = ["net"] }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
clap = { workspace = true }
rpassword = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bs58 = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2"
predicates = "3"
